name: Publish Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            src/components/
            src/lib/
            tailwind.css
            theme.css
            package.json
            README.md

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Publish to npm (skip if already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@dangbt/pro-ui@${VERSION}" version > /dev/null 2>&1; then
            echo "v${VERSION} already exists on npm — skipping."
          else
            pnpm publish --no-git-checks --access public --ignore-scripts --registry https://registry.npmjs.org
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release from CHANGELOG (skip if exists)
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          # Lấy mục "## <version>" trong CHANGELOG.md (tới heading "## " kế tiếp).
          awk -v v="$VERSION" '$0 == "## " v { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md thiếu mục '## $VERSION'"
            exit 1
          fi
          printf '\n---\n\nInstall: `npm i @dangbt/pro-ui@%s` · [npm](https://www.npmjs.com/package/@dangbt/pro-ui/v/%s) · [Full changelog](https://github.com/dangbt/pro-ui/blob/main/CHANGELOG.md)\n' "$VERSION" "$VERSION" >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest
        env:
          GH_TOKEN: ${{ github.token }}
