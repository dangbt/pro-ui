<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8f8ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#e0e7ff" stroke-width="1" opacity="0.6"/>
    </pattern>
    <!-- Glow for icon -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative blobs -->
  <ellipse cx="980" cy="120" rx="280" ry="200" fill="#6366f1" opacity="0.06"/>
  <ellipse cx="200" cy="520" rx="220" ry="160" fill="#818cf8" opacity="0.07"/>

  <!-- Icon (160×160 centered-left area) -->
  <g transform="translate(120, 215)">
    <rect width="200" height="200" rx="40" fill="url(#icon-grad)" filter="url(#glow)"/>
    <path
      transform="scale(6.25)"
      d="M 8 6 L 8 26 L 13 26 L 13 18 Q 24 18 24 12 Q 24 6 13 6 Z M 13 9 Q 21 9 21 12 Q 21 15 13 15 Z"
      fill="white"
      fill-rule="evenodd"
    />
  </g>

  <!-- Wordmark -->
  <text
    x="360" y="332"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="80"
    font-weight="700"
    letter-spacing="-2"
    fill="#1e1b4b"
  >pro-ui</text>

  <!-- Divider -->
  <rect x="120" y="460" width="960" height="1.5" fill="#c7d2fe" rx="1"/>

  <!-- Tagline -->
  <text
    x="120" y="510"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="26"
    font-weight="400"
    fill="#6366f1"
    letter-spacing="0.2"
  >Accessible · Themeable · Production-ready React components</text>

  <!-- Badges row -->
  <g transform="translate(120, 545)">
    <!-- React Aria badge -->
    <rect width="138" height="34" rx="17" fill="#eef2ff"/>
    <text x="69" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#6366f1" text-anchor="middle">React Aria</text>
    <!-- Tailwind v4 badge -->
    <rect x="150" width="138" height="34" rx="17" fill="#eef2ff"/>
    <text x="219" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#6366f1" text-anchor="middle">Tailwind v4</text>
    <!-- TypeScript badge -->
    <rect x="300" width="138" height="34" rx="17" fill="#eef2ff"/>
    <text x="369" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#6366f1" text-anchor="middle">TypeScript</text>
  </g>

  <!-- URL bottom-right -->
  <text
    x="1080" y="592"
    font-family="Inter, sans-serif"
    font-size="18"
    font-weight="500"
    fill="#a5b4fc"
    text-anchor="middle"
  >pro-ui.pages.dev</text>
</svg>
