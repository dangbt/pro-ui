<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="50%" stop-color="#1a1145"/>
      <stop offset="100%" stop-color="#0d0b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="url(#bg)"/>

  <!-- Decorative glows -->
  <ellipse cx="200" cy="100" rx="200" ry="150" fill="#6366f1" opacity="0.08" filter="url(#softglow)"/>
  <ellipse cx="800" cy="350" rx="250" ry="180" fill="#a78bfa" opacity="0.06" filter="url(#softglow)"/>

  <!-- Grid dots pattern -->
  <g opacity="0.15">
    <circle cx="50" cy="50" r="1.5" fill="#6366f1"/>
    <circle cx="100" cy="50" r="1.5" fill="#6366f1"/>
    <circle cx="150" cy="50" r="1.5" fill="#6366f1"/>
    <circle cx="200" cy="50" r="1.5" fill="#6366f1"/>
    <circle cx="50" cy="100" r="1.5" fill="#6366f1"/>
    <circle cx="100" cy="100" r="1.5" fill="#6366f1"/>
    <circle cx="150" cy="100" r="1.5" fill="#6366f1"/>
    <circle cx="200" cy="100" r="1.5" fill="#6366f1"/>
    <circle cx="800" cy="320" r="1.5" fill="#a78bfa"/>
    <circle cx="850" cy="320" r="1.5" fill="#a78bfa"/>
    <circle cx="900" cy="320" r="1.5" fill="#a78bfa"/>
    <circle cx="950" cy="320" r="1.5" fill="#a78bfa"/>
    <circle cx="800" cy="370" r="1.5" fill="#a78bfa"/>
    <circle cx="850" cy="370" r="1.5" fill="#a78bfa"/>
    <circle cx="900" cy="370" r="1.5" fill="#a78bfa"/>
    <circle cx="950" cy="370" r="1.5" fill="#a78bfa"/>
  </g>

  <!-- Left side: ❌ Wrong code block -->
  <g transform="translate(40, 130)">
    <rect width="300" height="160" rx="12" fill="#1c1335" stroke="#ef4444" stroke-width="1.5" opacity="0.9"/>
    <!-- Title bar -->
    <rect width="300" height="30" rx="12" fill="#251a42"/>
    <rect y="18" width="300" height="12" fill="#251a42"/>
    <circle cx="18" cy="15" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="36" cy="15" r="5" fill="#f59e0b" opacity="0.6"/>
    <circle cx="54" cy="15" r="5" fill="#22c55e" opacity="0.6"/>
    <text x="270" y="19" font-family="monospace" font-size="10" fill="#ef4444" text-anchor="end">❌</text>
    <!-- Code lines -->
    <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">&lt;</text>
    <text x="23" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f87171">DataTable</text>
    <text x="16" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">  data</text>
    <text x="52" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">={users}</text>
    <text x="135" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">// wrong</text>
    <text x="16" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">  cols</text>
    <text x="50" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">={columns}</text>
    <text x="145" y="88" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">// wrong</text>
    <text x="16" y="106" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">  onPageChange</text>
    <text x="120" y="106" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">={...}</text>
    <text x="165" y="106" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">// made up</text>
    <text x="16" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">/&gt;</text>
    <!-- Error underline -->
    <rect x="16" y="130" width="200" height="2" rx="1" fill="#ef4444" opacity="0.6"/>
    <text x="16" y="148" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">TS2322: Type error — prop does not exist</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(370, 200)">
    <path d="M 0 10 L 50 10 L 50 0 L 70 15 L 50 30 L 50 20 L 0 20 Z" fill="url(#accent)" opacity="0.8"/>
    <text x="35" y="50" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">MCP</text>
  </g>

  <!-- Right side: ✅ Correct code block -->
  <g transform="translate(470, 130)">
    <rect width="490" height="160" rx="12" fill="#1c1335" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
    <!-- Title bar -->
    <rect width="490" height="30" rx="12" fill="#251a42"/>
    <rect y="18" width="490" height="12" fill="#251a42"/>
    <circle cx="18" cy="15" r="5" fill="#ef4444" opacity="0.6"/>
    <circle cx="36" cy="15" r="5" fill="#f59e0b" opacity="0.6"/>
    <circle cx="54" cy="15" r="5" fill="#22c55e" opacity="0.8"/>
    <text x="460" y="19" font-family="monospace" font-size="10" fill="#10b981" text-anchor="end">✅ first try</text>
    <!-- Code lines -->
    <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">&lt;</text>
    <text x="23" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">ProTable</text>
    <text x="82" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">&lt;User&gt;</text>
    <text x="16" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">  columns</text>
    <text x="72" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">={columns}</text>
    <text x="16" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">  rowKey</text>
    <text x="64" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24">="id"</text>
    <text x="16" y="106" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">  request</text>
    <text x="68" y="106" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">={async ({ current, pageSize }) =&gt; {...}}</text>
    <text x="16" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">  rowSelection</text>
    <text x="105" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">={{ onChange: (keys) =&gt; ... }}</text>
    <text x="16" y="142" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">/&gt;</text>
  </g>

  <!-- Title -->
  <text x="500" y="55" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">
    Stop AI from hallucinating your component API
  </text>

  <!-- Subtitle -->
  <text x="500" y="90" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#a5b4fc" text-anchor="middle">
    Built-in MCP server → AI generates correct code on the first try
  </text>

  <!-- Bottom bar -->
  <rect y="390" width="1000" height="30" fill="#6366f1" opacity="0.15"/>
  <text x="500" y="410" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="0.5">
    @dangbt/pro-ui  ·  React Aria  ·  Tailwind v4  ·  30+ components  ·  pro-ui.pages.dev
  </text>
</svg>
